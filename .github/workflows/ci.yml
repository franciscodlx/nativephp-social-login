name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: packages/social-login
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  tools:
    name: Mocks and example backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: for dir in tools/*/; do (cd "$dir" && node --test) || exit 1; done

  demo:
    name: Demo app boots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan native:plugin:list

  release-plan:
    name: Version that would be released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(grep -m1 -oE '^## \[?[0-9]+\.[0-9]+\.[0-9]+[^] ]*' packages/social-login/CHANGELOG.md | sed -E 's/^## \[?//')
          if [ -z "$version" ]; then echo "::error::No '## x.y.z' entry in packages/social-login/CHANGELOG.md"; exit 1; fi
          if git ls-remote --exit-code --tags https://github.com/franciscodlx/nativephp-social-login-plugin.git "refs/tags/v$version" > /dev/null; then
            echo "v$version is already on Packagist: merging only updates dev-main."
          else
            echo "::notice::Merging publishes v$version to Packagist."
          fi
